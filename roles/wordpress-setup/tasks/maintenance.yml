---
- name: Setup maintenance tasks per WordPress site
  include_tasks: maintenance-site.yml
  loop: "{{ wordpress_sites | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    site_root: "{{ www_root }}/{{ item.key }}"
    site_current: "{{ site_root }}/{{ item.value.current_path | default('current') }}"
    site_cron_file: "wordpress-{{ item.key | replace('.', '_') }}"
