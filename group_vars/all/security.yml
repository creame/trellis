# Documentation: https://roots.io/trellis/docs/security/

ferm_input_list:
  - type: dport_accept
    dport: [http]
    filename: nginx_accept
  - type: dport_accept
    dport: [https]
    filename: nginx_accept_https
    delete: "{{ not (sites_use_ssl | bool) }}"
  - type: dport_accept
    dport: ['443']
    protocol: udp
    filename: nginx_accept_http3
    delete: "{{ not (nginx_http3_enabled and (sites_use_ssl | bool)) }}"
  - type: dport_accept
    dport: [ssh]
    saddr: "{{ ip_whitelist }}"
  - type: dport_limit
    dport: [ssh]
    seconds: 300
    hits: 20


# Enable built-in fail2ban services or add your own custom ones
fail2ban_bantime: 3600
fail2ban_services_custom:
  - name: wordpress_xmlrpc
    filter: wordpress-xmlrpc
    enabled: "true"
    port: http,https
    logpath: "{{ www_root }}/**/logs/access.log"
  - name: wordpress_wp_login
    filter: wordpress-wp-login
    enabled: "true"
    port: http,https
    logpath: "{{ www_root }}/**/logs/access.log"
  - name: wordpress_user_enum
    filter: wordpress-user-enum
    enabled: "true"
    port: http,https
    logpath: "{{ www_root }}/**/logs/access.log"
  - name: wordpress_env_probe
    filter: wordpress-env-probe
    enabled: "true"
    port: http,https
    logpath: "{{ www_root }}/**/logs/access.log"
    maxretry: 2
    bantime: 86400
  - name: wordpress_git_probe
    filter: wordpress-git-probe
    enabled: "true"
    port: http,https
    logpath: "{{ www_root }}/**/logs/access.log"
    maxretry: 2
    bantime: 86400
  - name: nginx_php_scan
    filter: nginx-php-scan
    enabled: "true"
    port: http,https
    logpath: "{{ www_root }}/**/logs/access.log"
    maxretry: 15
    findtime: 30
    bantime: 86400
  - name: wordpress_wp_admin_404
    filter: wordpress-wp-admin-404
    enabled: "true"
    port: http,https
    logpath: "{{ www_root }}/**/logs/access.log"
    maxretry: 10
    findtime: 300
  - name: nginx_scan_flood
    filter: nginx-scan-flood
    enabled: "true"
    port: http,https
    logpath: "{{ www_root }}/**/logs/access.log"
    maxretry: 120
    findtime: 30

# If sshd_permit_root_login: false, admin_user must be in 'users' (`group_vars/all/users.yml`) with sudo group
# and in 'vault_users' (`group_vars/staging/vault.yml`, `group_vars/production/vault.yml`)
sshd_permit_root_login: false
sshd_password_authentication: false

ip_whitelist:
  - 127.0.0.0/8
  - "{{ ipify_public_ip | default('') }}"
